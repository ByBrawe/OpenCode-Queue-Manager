name: Publish npm (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install package dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify package
        run: npm run verify
      - name: Preview package
        run: npm pack --dry-run --ignore-scripts
      # Requires npm Trusted Publishing to be configured for this GitHub workflow.
      # Refuses to publish when OIDC trust has not been configured.
      - name: Publish using npm Trusted Publishing
        run: npm publish --access public --provenance
